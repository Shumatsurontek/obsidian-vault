[project]
name = "vault-mcp-shared"
version = "0.1.0"
description = "Shared utilities: tracing, oauth, session store, mcp sdk compat"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "cryptography>=43",
    "fastmcp>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
