[project]
name = "vault-mcp"
version = "0.1.0"
description = "Obsidian vault MCP server + Deep Agents orchestration"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "obsidian_mcp", "agents", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PIE", "T20", "PT", "RET", "PERF"]
# ARG001: tools receive a FastMCP-injected `ctx` they don't always read.
ignore = ["B008", "ARG001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"
