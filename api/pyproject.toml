[project]
name = "vault-api"
version = "0.1.0"
description = "FastAPI backend wrapping the vault MCP + agents, deployed on Vercel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "vault-mcp-shared",
    "vault-agents",
]

[tool.uv.sources]
vault-mcp-shared = { workspace = true }
vault-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
