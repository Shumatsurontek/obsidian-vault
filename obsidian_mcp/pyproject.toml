[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "FastMCP server exposing an Obsidian vault via the Local REST API plugin"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "vault-mcp-shared",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:cli"

[tool.uv.sources]
vault-mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_mcp"]
